<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riddle &amp; Rune</title>
<style>
  :root{ --gold:#ffc64b; --rune:#c8a6ff; --mana:#7c5cff; --frost:#7ce7ff; --ember:#ff7a3c; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#fff}
  #cine{position:fixed;inset:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:pointer}
  #dragonVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;
    filter:brightness(.66) contrast(1.14) saturate(1.05);transform:scale(1.04);
    transition:opacity .6s ease;will-change:opacity,transform;
    -webkit-mask-image:radial-gradient(ellipse 78% 74% at 50% 44%, #000 42%, rgba(0,0,0,.3) 80%, rgba(0,0,0,0) 100%);
    mask-image:radial-gradient(ellipse 78% 74% at 50% 44%, #000 42%, rgba(0,0,0,.3) 80%, rgba(0,0,0,0) 100%)}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
  .layer{position:absolute;inset:0;pointer-events:none}
  .vignette{z-index:12;background:radial-gradient(125% 95% at 50% 48%,transparent 40%,rgba(0,0,0,.5) 76%,rgba(0,0,0,.94) 100%)}
  .flash{z-index:15;background:#fff;opacity:0}
  .bar{position:absolute;left:0;right:0;height:7vh;background:#000;z-index:14;transition:transform 1s cubic-bezier(.7,0,.3,1)}
  .bar.top{top:0;transform:translateY(-100%)} .bar.bot{bottom:0;transform:translateY(100%)}
  #cine.framed .bar.top{transform:translateY(0)} #cine.framed .bar.bot{transform:translateY(0)}
  #cine.unframe .bar.top{transform:translateY(-100%)} #cine.unframe .bar.bot{transform:translateY(100%)}

  .line{position:absolute;left:0;right:0;top:16%;z-index:13;text-align:center;padding:0 10vw;
    font-size:clamp(15px,4.6vw,25px);font-weight:300;letter-spacing:.05em;line-height:1.5;color:#eee9ff;
    opacity:0;transform:translateY(12px);text-shadow:0 2px 22px #000,0 0 40px rgba(0,0,0,.8);text-wrap:balance;
    transition:opacity 1s,transform 1s}
  .line.show{opacity:.94;transform:none}
  .line em{color:var(--rune);font-style:normal}

  .titleWrap{position:absolute;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
  .titleWrap.show{opacity:1}
  .title{font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:.9;text-align:center;
    font-family:"Arial Black","Helvetica Neue",system-ui,sans-serif;font-size:clamp(42px,13.5vw,112px)}
  .title .w{display:inline-block}
  .title .ch{display:inline-block;opacity:0;transform:translateY(46px) scale(.5) rotate(-7deg);
    background:linear-gradient(180deg,#fff 8%,var(--rune) 72%,var(--mana));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 30px rgba(124,92,255,.8))}
  .title .amp{font-size:.6em;vertical-align:.12em;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px var(--gold))}
  .title .ch.in{animation:slam .5s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes slam{to{opacity:1;transform:none}}
  .tagline{margin-top:min(3.2vh,24px);font-size:clamp(11px,3vw,16px);letter-spacing:.42em;text-transform:uppercase;
    color:var(--frost);opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s;text-shadow:0 0 22px rgba(124,224,255,.5);white-space:nowrap}
  .tagline.show{opacity:.9;transform:none}

  .tap{position:absolute;left:0;right:0;bottom:12%;z-index:17;text-align:center;font-size:12px;letter-spacing:.4em;
    text-transform:uppercase;color:#d3d5f2;opacity:0;transition:opacity 1s}
  .tap.show{opacity:.8;pointer-events:auto;animation:tapPulse 2s ease-in-out infinite}
  @keyframes tapPulse{0%,100%{opacity:.8}50%{opacity:.4}}

  .gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(120% 80% at 50% 40%,#160f33,#000 78%);text-align:center;transition:opacity .55s}
  .gate.hide{opacity:0;pointer-events:none}
  .gate .rr{font-size:44px;color:var(--rune);text-shadow:0 0 30px var(--mana);animation:gspin 12s linear infinite}
  @keyframes gspin{to{transform:rotate(360deg)}}
  .gate h1{font-family:"Arial Black",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(26px,8vw,52px);
    background:linear-gradient(180deg,#fff,var(--rune));-webkit-background-clip:text;background-clip:text;color:transparent}
  .gate .amp{color:var(--gold);-webkit-text-fill-color:var(--gold)}
  .gate button{font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1px solid rgba(200,166,255,.4);
    background:rgba(124,92,255,.16);padding:14px 30px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px)}
  .gate small{color:#8a86b8;font-size:11px;letter-spacing:.1em}
  .snd{position:absolute;right:14px;top:calc(7vh + 12px);z-index:22;width:40px;height:40px;border-radius:12px;
    border:1px solid rgba(190,210,255,.28);background:rgba(8,12,24,.6);color:#eaf3ff;font-size:17px;cursor:pointer}
  .skip{position:absolute;right:16px;bottom:calc(7vh + 12px);z-index:22;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#9a97c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:999px;cursor:pointer;opacity:0;transition:opacity .5s}
  .skip.show{opacity:.7;pointer-events:auto}
  @media (prefers-reduced-motion:reduce){.rr{animation:none}}
</style>
</head>
<body>
<div id="cine">
  <video id="dragonVid" muted playsinline preload="auto"
    src="media/saga/App Videos/Dragon_spreading_wings_cinematic…_1080p_202607261644.mp4"></video>
  <canvas id="c"></canvas>
  <div class="layer vignette"></div>
  <div class="layer flash" id="flash"></div>
  <div class="bar top"></div>
  <div class="bar bot"></div>
  <div class="line" id="line"></div>
  <div class="titleWrap" id="titleWrap">
    <div class="title" id="title"></div>
    <div class="tagline" id="tagline">Answer &nbsp;·&nbsp; Strike &nbsp;·&nbsp; Descend</div>
  </div>
  <div class="tap" id="tap">Tap to begin</div>
  <button class="snd" id="snd" aria-label="Sound on/off">🔇</button>
  <div class="skip" id="skip">Skip ▸</div>
  <div class="gate" id="gate">
    <div class="rr">ᛟ</div>
    <h1>Riddle <span class="amp">&amp;</span> Rune</h1>
    <button id="begin">▶&nbsp; Enter</button>
    <small>silent by default · tap 🔊 for sound</small>
  </div>
</div>
<!-- swap for soft-neon.mp3 / trance-overture.mp3 -->
<audio id="song" src="music/ambient-synth-overture.mp3" preload="auto"></audio>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
const RUNES="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ";
const rnd=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const $=id=>document.getElementById(id);
// Real uploaded dragon as the intro's beast; emoji stays as a graceful fallback.
const dragonVid=$('dragonVid'); let vidReady=false;
try{ dragonVid.src=encodeURI("media/saga/App Videos/Dragon_spreading_wings_cinematic…_1080p_202607261644.mp4"); }catch(e){}
dragonVid.addEventListener('canplay',()=>{vidReady=true;},{once:true});
dragonVid.addEventListener('error',()=>{vidReady=false;});

let embers=[],glyphs=[],sparks=[],smoke=[];
function seed(){
  embers=[];glyphs=[];sparks=[];smoke=[];
  for(let i=0;i<80;i++)embers.push({x:rnd(0,W),y:rnd(0,H+H),vy:rnd(-30,-10),r:rnd(.6,2.4),h:rnd(16,40),a:rnd(.25,.8),d:rnd(0,1)});
  for(let i=0;i<22;i++)glyphs.push({x:rnd(0,W),y:rnd(0,H),vy:rnd(-6,-2),ch:RUNES[Math.random()*RUNES.length|0],s:rnd(12,30),a:rnd(.05,.18),tw:rnd(0,6.28)});
  for(let i=0;i<30;i++)smoke.push({x:rnd(.2,.8)*W,y:rnd(.5,1)*H,r:rnd(40,110),vy:rnd(-10,-3),a:rnd(.03,.1)});
}
function spark(x,y,col,n,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(spd*.25,spd);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rnd(0,40),life:rnd(.5,1.4),t:0,r:rnd(1,3.4),col});}}

/* ---------- the DRAGON (emoji, cinematically lit) ---------- */
function drawDragon(cx,cy,size,glowP,alpha,rot,bright){
  ctx.save(); ctx.globalAlpha=alpha;
  const gl=ctx.createRadialGradient(cx,cy,8,cx,cy,size*1.06);
  gl.addColorStop(0,`rgba(255,100,48,${.30+glowP*.5})`);
  gl.addColorStop(.5,`rgba(150,80,255,${.14+glowP*.22})`);
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(cx,cy,size*1.06,0,6.28); ctx.fill();
  ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.filter=`brightness(${(.28+glowP*.44+bright).toFixed(2)}) saturate(1.3) contrast(1.2) drop-shadow(0 0 ${(20+glowP*34)|0}px rgba(255,66,28,.95)) drop-shadow(0 0 66px rgba(150,58,255,.55))`;
  ctx.font=size+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('\uD83D\uDC09',0,0);
  ctx.filter='none'; ctx.restore();
}

/* ---------- audio ---------- */
let AC=null;
// Global audio switch (same key as the app) — the cinematic stays silent unless
// the player turned sound on. Toggling mid-film joins the score at the beat.
let sndOn=false; try{ sndOn=localStorage.getItem('quizrush-audio')==='on'; }catch(e){}
addEventListener('pagehide',()=>{ const s=$('song'); try{s.pause();s.currentTime=0;}catch(e){} if(AC){try{AC.close();}catch(e){} AC=null;} });
function boom(w,f=50,d=1.4,v=.5){const t=AC.currentTime+w;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.1);}
function roar(w){const t=AC.currentTime+w;const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(58,t+1.1);o.frequency.linearRampToValueAtTime(70,t+1.4);lp.type='lowpass';lp.frequency.value=900;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.42,t+.18);g.gain.setValueAtTime(.42,t+1.0);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(lp).connect(g).connect(AC.destination);o.start(t);o.stop(t+1.7);
  const nl=AC.sampleRate*1.4,nb=AC.createBuffer(1,nl,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=(Math.random()*2-1)*Math.min(1,(1-i/nl)*1.4);const ns=AC.createBufferSource();ns.buffer=nb;const nf=AC.createBiquadFilter();nf.type='lowpass';nf.frequency.value=500;const ng=AC.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.linearRampToValueAtTime(.3,t+.2);ng.gain.exponentialRampToValueAtTime(.0001,t+1.5);ns.connect(nf).connect(ng).connect(AC.destination);ns.start(t);}
function riser(w,d=3,v=.16){const t=AC.currentTime+w;const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(430,t+d);lp.type='lowpass';lp.frequency.setValueAtTime(300,t);lp.frequency.exponentialRampToValueAtTime(2600,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.85);g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);o.connect(lp).connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.2);}
function noiseHit(w,d=.5,v=.4,type='highpass',f=700){const t=AC.currentTime+w;const len=AC.sampleRate*d,buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=buf;const bp=AC.createBiquadFilter();bp.type=type;bp.frequency.value=f;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bp).connect(g).connect(AC.destination);s.start(t);}
function shimmer(w,v=.12){const t=AC.currentTime+w;[523,659,784,1046].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.05);g.gain.exponentialRampToValueAtTime(v,t+i*.05+.04);g.gain.exponentialRampToValueAtTime(.0001,t+i*.05+1.1);o.connect(g).connect(AC.destination);o.start(t+i*.05);o.stop(t+i*.05+1.2);});}
function sfx(){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  boom(0.2,60,1.6,.3); boom(3.6,46,1.8,.42);      // wake
  roar(6.4);                                       // ROAR
  riser(9.2,3.0,.18);                              // blade rise
  noiseHit(12.4,.55,.45,'bandpass',1100);          // slash
  boom(12.6,38,2.1,.75); noiseHit(12.6,.6,.4,'highpass',400); // KILL impact
  shimmer(13.7,.13); boom(13.8,72,1.4,.28);        // title
}

/* ---------- timeline ---------- */
const LINES=[
  {t:1.3,end:3.9,html:"Beneath the frozen vale burns <em>Malrune</em> — the Unanswered."},
  {t:4.5,end:6.3,html:"The ice above him is a seal — and it is failing."},
  {t:6.9,end:9.0,html:"His first flame slips free now, to devour the <em>unknowing</em>."},
  {t:9.5,end:12.2,html:"You carry no blade — only <em>what you know</em>."},
];
let started=false,t0=0,flags=new Set(),dragon=null,slashX=null,titleDone=false;

function start(){
  if(started)return; started=true; resize(); seed();
  const g=$('gate'); g.classList.add('hide'); setTimeout(()=>g.style.display='none',600);
  $('cine').classList.add('framed'); $('skip').classList.add('show');
  if(sndOn){
    const s=$('song'); s.volume=0; s.play().then(()=>{let v=0;const fi=setInterval(()=>{v=Math.min(.85,v+.04);s.volume=v;if(v>=.85)clearInterval(fi);},60);}).catch(()=>{});
    sfx();
  }
  try{ dragonVid.play().catch(()=>{}); }catch(e){}
  dragon={rise:0,glow:0,alpha:0,bright:0,slain:false,rot:0,spin:0,sink:0};
  t0=performance.now(); requestAnimationFrame(loop);
}
function forgeTitle(){
  if(titleDone)return; titleDone=true;
  $('cine').classList.add('unframe');
  const el=$('title'); el.innerHTML='<span class="w">RIDDLE</span> <span class="ch amp">&amp;</span> <span class="w">RUNE</span>';
  el.querySelectorAll('.w').forEach(w=>{w.innerHTML=[...w.textContent].map(c=>`<span class="ch">${c}</span>`).join('');});
  $('titleWrap').classList.add('show');
  const chars=[...el.querySelectorAll('.ch')];
  chars.forEach((c,i)=>setTimeout(()=>{c.classList.add('in');const r=c.getBoundingClientRect();spark(r.left+r.width/2,r.top+r.height/2,['#fff','#ffc64b','#c8a6ff'][i%3],9,200);},110+i*70));
  setTimeout(()=>$('tagline').classList.add('show'),110+chars.length*70+220);
  setTimeout(()=>$('tap').classList.add('show'),110+chars.length*70+800);
}

function loop(now){
  const t=(now-t0)/1000, dt=Math.min(.05,(now-(loop._p||now))/1000); loop._p=now;
  LINES.forEach((L,i)=>{if(!flags.has('on'+i)&&t>=L.t){flags.add('on'+i);$('line').innerHTML=L.html;$('line').classList.add('show');}
    if(!flags.has('off'+i)&&t>=L.end){flags.add('off'+i);$('line').classList.remove('show');}});

  if(dragon){
    dragon.rise=Math.min(1,Math.max(0,(t-3)/2.6));
    if(!dragon.slain)dragon.alpha=dragon.rise;
    const roarE=Math.max(0,Math.min(1,(t-6.4)/.5))*Math.max(0,Math.min(1,(8.9-t)/.6));
    if(!dragon.slain)dragon.glow=.18+roarE*.95+Math.sin(t*3)*.04;
    // fire breath during the roar
    if(roarE>.45){const bx=W/2+rnd(-60,-150),by=H*.42+(1-dragon.rise)*H*.55+rnd(-6,46);
      for(let n=0;n<2;n++)sparks.push({x:bx,y:by,vx:rnd(-170,-50),vy:rnd(-40,50),life:rnd(.4,.95),t:0,r:rnd(2,4.5),col:['#ffe0a0','#ff8a3c','#ff5326'][Math.random()*3|0]});}
    if(!flags.has('slash')&&t>=12.3){flags.add('slash');slashX=-.2;}
    if(!flags.has('kill')&&t>=12.6){flags.add('kill');dragon.slain=true;dragon.killAt=t;dragon.bright=3.8;
      $('flash').animate([{opacity:0},{opacity:1,offset:.1},{opacity:0}],{duration:640,easing:'ease-out'});
      if(!reduce)$('cine').animate([{transform:'translate(0,0)'},{transform:'translate(-13px,8px)'},{transform:'translate(11px,-6px)'},{transform:'translate(0,0)'}],{duration:580});
      for(let n=0;n<150;n++)spark(W/2,H*.44,['#fff','#ffc64b','#ff7a3c','#c8a6ff'][n%4],1,rnd(70,560));
      $('line').classList.remove('show');
    }
    if(dragon.slain){const held=t-dragon.killAt;
      if(held>0.24){dragon.alpha=Math.max(0,dragon.alpha-dt*1.7);dragon.spin+=dt*2.6;dragon.sink+=dt*96;}
      dragon.bright=Math.max(0,dragon.bright-dt*3.2);
      if(dragon.alpha>0&&held>0.12)for(let n=0;n<5;n++)embers.push({x:W/2+rnd(-120,120),y:H*.46+rnd(-60,80),vy:rnd(-90,-38),r:rnd(1,3.4),h:rnd(16,42),a:rnd(.5,.98),d:rnd(0,1)});
    }
  }
  // real dragon video: rise in as the beast wakes, dissolve on the killing blow
  if(vidReady){
    let op=Math.max(0,Math.min(1,(t-2.4)/2.8));
    if(t>=12.55) op=Math.max(0,1-(t-12.55)/0.55);
    dragonVid.style.opacity=op.toFixed(3);
    dragonVid.style.transform='scale('+(1.04+Math.min(.14,t*.007)).toFixed(3)+')';
  }
  if(!flags.has('title')&&t>=13.6){flags.add('title');forgeTitle();}
  render(t,dt);
  requestAnimationFrame(loop);
}

function render(t,dt){
  if(vidReady){
    // canvas is an overlay on the real dragon video — keep it transparent,
    // add only an additive fire/mana glow that swells with the roar
    ctx.clearRect(0,0,W,H);
    const gI=dragon?Math.max(0,dragon.glow):0;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const rg=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.min(W,H)*.62);
    rg.addColorStop(0,`rgba(255,120,60,${(.05+gI*.16).toFixed(3)})`);
    rg.addColorStop(.6,`rgba(150,80,255,${(.03+gI*.06).toFixed(3)})`);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H); ctx.restore();
  } else {
    const warm=Math.max(0,Math.min(1,(t-5)/8));
    const g=ctx.createRadialGradient(W/2,H*.46,0,W/2,H*.46,Math.max(W,H)*.8);
    g.addColorStop(0,`rgba(${26+warm*46},${12+warm*8},${42+warm*22},1)`);g.addColorStop(.55,'#0a0714');g.addColorStop(1,'#000');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }
  const zoom=1+Math.min(.14,t*.008); ctx.save(); ctx.translate(W/2,H/2); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);

  // smoke
  smoke.forEach(p=>{p.y+=p.vy*dt;if(p.y<-p.r){p.y=H+p.r;p.x=rnd(.15,.85)*W;} const sg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);sg.addColorStop(0,`rgba(60,40,90,${p.a})`);sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();});
  // runes
  ctx.textAlign='center';ctx.textBaseline='middle';
  glyphs.forEach(gl=>{gl.y+=gl.vy*dt;gl.tw+=dt;if(gl.y<-20){gl.y=H+20;gl.x=rnd(0,W);}const fl=(Math.sin(gl.tw)*.5+.5);ctx.globalAlpha=gl.a*(.4+fl*.6);ctx.fillStyle='#b79bff';ctx.shadowColor='#7c5cff';ctx.shadowBlur=12;ctx.font=gl.s+'px serif';ctx.fillText(gl.ch,gl.x,gl.y);});
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  // DRAGON — emoji fallback only when the real video isn't available
  if(!vidReady && dragon && dragon.alpha>0.01 && t>2.6){
    const lunge=dragon.slain?0:Math.max(0,Math.min(1,(t-10.8)/1.5));
    const size=Math.min(W,H)*(0.52+0.12*dragon.rise)*(1+lunge*0.34);
    const cy=H*0.42 + (1-dragon.rise)*H*0.55 + dragon.sink + lunge*H*0.05;
    const bob=dragon.slain?dragon.spin:Math.sin(t*1.4)*0.022;
    drawDragon(W/2, cy, size, dragon.glow, dragon.alpha, bob, dragon.bright);
  }
  // blade of light forms, then it swings
  if(t>8.8 && t<12.55){
    const grow=Math.min(1,(t-8.8)/2.0), fade=t>12.3?Math.max(0,(12.55-t)/0.25):1;
    const bx=W/2, topY=H*0.5-H*0.36*grow, botY=H*0.5+H*0.12*grow, bw=2+5*grow;
    ctx.globalAlpha=Math.min(1,grow)*fade;
    const lg=ctx.createLinearGradient(bx-bw,0,bx+bw,0);
    lg.addColorStop(0,'rgba(124,224,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.95)');lg.addColorStop(1,'rgba(124,92,255,0)');
    ctx.fillStyle=lg; ctx.shadowColor='#8fe6ff'; ctx.shadowBlur=30; ctx.fillRect(bx-bw,topY,bw*2,botY-topY); ctx.shadowBlur=0;
    ctx.fillStyle='#eadfff'; ctx.font='15px serif'; ctx.shadowColor='#c8a6ff'; ctx.shadowBlur=10; ctx.globalAlpha=grow*fade;
    for(let i=0;i<6;i++){const yy=botY-((t*80+i*38)%Math.max(1,botY-topY)); ctx.fillText(RUNES[(i*3+((t*4)|0))%RUNES.length],bx,yy);}
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  // slash streak across the dragon
  if(slashX!==null && slashX<1.3){ slashX+=dt*3.2; const sx=slashX*W, sy=H*.2;
    ctx.globalAlpha=Math.max(0,1-Math.abs(slashX-.6)); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.shadowColor='#bfe9ff'; ctx.shadowBlur=30;
    ctx.beginPath(); ctx.moveTo(sx-180,sy); ctx.lineTo(sx+80,sy+H*.6); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  // embers
  embers.forEach(p=>{p.y+=p.vy*dt;p.x+=Math.sin((t+p.d*6)*1.2)*3*dt;if(p.y<-10){p.y=H+rnd(0,60);p.x=rnd(0,W);}const fl=.6+.4*Math.sin(t*4+p.d*7);ctx.globalAlpha=p.a*fl;ctx.fillStyle=`hsl(${p.h},100%,62%)`;ctx.shadowColor=`hsl(${p.h},100%,55%)`;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();});
  ctx.shadowBlur=0;
  // sparks
  sparks.forEach(s=>{s.t+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=140*dt;const k=1-s.t/s.life;if(k<=0)return;ctx.globalAlpha=Math.max(0,k);ctx.fillStyle=s.col;ctx.shadowColor=s.col;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(s.x,s.y,s.r*k,0,6.28);ctx.fill();});
  sparks=sparks.filter(s=>s.t<s.life);
  ctx.shadowBlur=0;ctx.globalAlpha=1; ctx.restore();
}

  sndOn=!sndOn; try{ localStorage.setItem('quizrush-audio',sndOn?'on':'off'); }catch(err){}
  $('snd').textContent=sndOn?'🔊':'🔇';
  const s=$('song');

  if(started){ try{ s.currentTime=Math.max(0,(performance.now()-t0)/1000); }catch(err){} s.volume=.85; s.play().catch(()=>{}); }
});
$('snd').textContent=sndOn?'🔊':'🔇';
$('begin').addEventListener('click',e=>{e.stopPropagation();start();});
$('skip').addEventListener('click',e=>{e.stopPropagation();enter();});

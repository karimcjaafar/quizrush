<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riddle &amp; Rune</title>
<style>
  :root{ --gold:#ffc64b; --rune:#c8a6ff; --mana:#7c5cff; --frost:#7ce7ff; --ember:#ff7a3c; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#fff}
  #cine{position:fixed;inset:0;background:#000;overflow:hidden;cursor:pointer}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* cinematic framing */
  .bar{position:absolute;left:0;right:0;height:11vh;background:#000;z-index:20;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
  .bar.top{top:0;transform:translateY(-100%)}
  .bar.bot{bottom:0;transform:translateY(100%)}
  #cine.framed .bar.top{transform:translateY(0)}
  #cine.framed .bar.bot{transform:translateY(0)}
  .vignette{position:absolute;inset:0;z-index:12;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 46%,transparent 42%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.92) 100%)}
  .grain{position:absolute;inset:-50%;z-index:13;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grain .5s steps(3) infinite}
  @keyframes grain{to{transform:translate(6%,4%)}}
  .flash{position:absolute;inset:0;z-index:15;background:#fff;opacity:0;pointer-events:none}

  /* narrative lines */
  .line{position:absolute;left:0;right:0;top:50%;z-index:14;text-align:center;padding:0 10vw;
    font-size:clamp(15px,4.6vw,26px);font-weight:300;letter-spacing:.06em;line-height:1.5;color:#e9e6ff;
    opacity:0;transform:translateY(14px);text-shadow:0 2px 20px rgba(0,0,0,.9);text-wrap:balance;
    transition:opacity 1.1s ease,transform 1.1s ease}
  .line.show{opacity:.92;transform:translateY(0)}
  .line em{color:var(--rune);font-style:normal}

  /* title */
  .titleWrap{position:absolute;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  .titleWrap.show{opacity:1}
  .title{font-weight:900;text-transform:uppercase;letter-spacing:.02em;line-height:.9;text-align:center;
    font-family:"Arial Black","Helvetica Neue",system-ui,sans-serif;font-size:clamp(40px,13vw,110px)}
  .title .w{display:inline-block}
  .title .ch{display:inline-block;opacity:0;transform:translateY(40px) scale(.6) rotate(-6deg);
    background:linear-gradient(180deg,#fff 10%,var(--rune) 70%,var(--mana));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 26px rgba(124,92,255,.75))}
  .title .amp{font-size:.62em;vertical-align:.1em;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px var(--gold))}
  .title .ch.in{animation:slam .5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes slam{to{opacity:1;transform:none}}
  .tagline{margin-top:min(3.4vh,26px);font-size:clamp(11px,3vw,16px);letter-spacing:.42em;text-transform:uppercase;
    color:var(--frost);opacity:0;transform:translateY(10px);transition:opacity 1s .1s,transform 1s .1s;text-shadow:0 0 20px rgba(124,224,255,.5);white-space:nowrap}
  .tagline.show{opacity:.9;transform:none}
  .rune-orbit{position:absolute;font-size:clamp(20px,6vw,40px);color:var(--rune);opacity:0;filter:drop-shadow(0 0 12px var(--mana))}

  /* tap-to-begin */
  .tap{position:absolute;left:0;right:0;bottom:15vh;z-index:17;text-align:center;font-size:12px;letter-spacing:.4em;
    text-transform:uppercase;color:#cdd0ee;opacity:0;transition:opacity 1s;animation:tapPulse 2s ease-in-out infinite}
  .tap.show{opacity:.75}
  @keyframes tapPulse{50%{opacity:.35}}

  /* gate */
  .gate{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(120% 80% at 50% 40%,#160f33,#000 78%);text-align:center;transition:opacity .6s}
  .gate.hide{opacity:0;pointer-events:none}
  .gate .rr{font-size:44px;color:var(--rune);text-shadow:0 0 30px var(--mana);animation:gspin 12s linear infinite}
  @keyframes gspin{to{transform:rotate(360deg)}}
  .gate h1{font-family:"Arial Black",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(26px,8vw,52px);
    background:linear-gradient(180deg,#fff,var(--rune));-webkit-background-clip:text;background-clip:text;color:transparent}
  .gate .amp{color:var(--gold);-webkit-text-fill-color:var(--gold)}
  .gate button{font-family:inherit;font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1px solid rgba(200,166,255,.4);
    background:rgba(124,92,255,.16);padding:14px 30px;border-radius:999px;cursor:pointer;backdrop-filter:blur(4px)}
  .gate small{color:#8a86b8;font-size:11px;letter-spacing:.1em}
  .skip{position:absolute;right:16px;bottom:calc(11vh + 14px);z-index:22;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:#9a97c0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:7px 14px;border-radius:999px;cursor:pointer;opacity:0;transition:opacity .5s}
  .skip.show{opacity:.7}
  @media (prefers-reduced-motion:reduce){.grain,.rr{animation:none}}
</style>
</head>
<body>
<div id="cine">
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <div class="flash" id="flash"></div>
  <div class="bar top"></div>
  <div class="bar bot"></div>

  <div class="line" id="line"></div>

  <div class="titleWrap" id="titleWrap">
    <div class="title" id="title"></div>
    <div class="tagline" id="tagline">Answer &nbsp;·&nbsp; Strike &nbsp;·&nbsp; Descend</div>
  </div>

  <div class="tap" id="tap">Tap to begin</div>
  <div class="skip" id="skip">Skip ▸</div>

  <div class="gate" id="gate">
    <div class="rr">ᛟ</div>
    <h1>Riddle <span class="amp">&amp;</span> Rune</h1>
    <button id="begin">▶&nbsp; Enter</button>
    <small>headphones recommended · sound on</small>
  </div>
</div>

<!-- swap the src for a different track: soft-neon.mp3 / trance-overture.mp3 -->
<audio id="song" src="music/ambient-synth-overture.mp3" preload="auto"></audio>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);

const RUNES="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ";
const rnd=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

// ---------- particle systems ----------
let embers=[], ash=[], glyphs=[], eyes=[], sparks=[], swing=null;
function seed(){
  embers=[]; ash=[]; glyphs=[]; eyes=[]; sparks=[]; swing=null;
  for(let i=0;i<90;i++)embers.push({x:rnd(0,W),y:rnd(0,H+H),vy:rnd(-26,-9),r:rnd(.6,2.4),h:rnd(18,42),a:rnd(.25,.8),d:rnd(0,1)});
  for(let i=0;i<40;i++)ash.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-8,8),vy:rnd(4,16),r:rnd(1,3),a:rnd(.05,.22)});
  for(let i=0;i<26;i++)glyphs.push({x:rnd(0,W),y:rnd(0,H),vy:rnd(-6,-2),ch:RUNES[Math.random()*RUNES.length|0],s:rnd(12,30),a:rnd(.05,.2),tw:rnd(0,6.28)});
  // monster eyes across the mid-dark
  const n=13;
  for(let i=0;i<n;i++){const cx=rnd(.08,.92)*W, cy=rnd(.28,.72)*H, sc=rnd(.7,1.5);
    eyes.push({x:cx,y:cy,sc,open:0,blink:0,nextBlink:rnd(1,3),born:rnd(4,7.2),dead:false,hue:Math.random()<.35?0:rnd(255,285)});}
}
function spark(x,y,col,n,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=rnd(spd*.3,spd);sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rnd(0,40),life:rnd(.5,1.3),t:0,r:rnd(1,3),col});}}

// ---------- audio SFX (Web Audio) ----------
let AC=null;
function boom(when,f=52,dur=1.4,vol=.5){const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.5);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.1);}
function riser(when,dur=3.2,vol=.16){const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(420,t+dur);lp.type='lowpass';lp.frequency.setValueAtTime(300,t);lp.frequency.exponentialRampToValueAtTime(2600,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.85);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.15);o.connect(lp).connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.2);}
function noiseHit(when,dur=.5,vol=.35,type='highpass',f=800){const t=AC.currentTime+when;const len=AC.sampleRate*dur;const buf=AC.createBuffer(1,len,AC.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=buf;const bp=AC.createBiquadFilter();bp.type=type;bp.frequency.value=f;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp).connect(g).connect(AC.destination);s.start(t);}
function shimmer(when,vol=.12){const t=AC.currentTime+when;[523,659,784,1046].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.05);g.gain.exponentialRampToValueAtTime(vol,t+i*.05+.04);g.gain.exponentialRampToValueAtTime(.0001,t+i*.05+1.1);o.connect(g).connect(AC.destination);o.start(t+i*.05);o.stop(t+i*.05+1.2);});}
function clang(when){const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(140,t+.25);g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.45);}
function scheduleSFX(){
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  boom(0.2,60,1.6,.35);           // descent hit
  boom(4.0,46,1.8,.5); boom(4.5,44,1.6,.4);   // horde reveal
  riser(9.0,4.0,.18);             // blade rise
  clang(9.4);
  noiseHit(12.9,.6,.4,'bandpass',1200); // swing whoosh
  boom(13.15,40,2.0,.7);          // strike impact
  noiseHit(13.15,.5,.4,'highpass',500);
  shimmer(13.9,.13);              // title forge
  boom(14.0,70,1.4,.3);
}

// ---------- timeline ----------
const LINES=[
  {t:1.5,end:4.2,html:"Beneath the world, the old <em>riddles</em> stir…"},
  {t:4.6,end:8.0,html:"…hungering for the <em>unknowing</em>."},
  {t:8.4,end:12.4,html:"But a sharp mind cuts deeper than any <em>blade</em>."},
];
let started=false, t0=0, done=new Set(), strikeDone=false, titleDone=false;
const $=id=>document.getElementById(id);

function start(){
  if(started)return; started=true;
  resize(); seed();
  $('gate').classList.add('hide');
  $('cine').classList.add('framed');
  $('skip').classList.add('show');
  const song=$('song'); song.volume=0; song.play().then(()=>{ // gentle fade-in
    let v=0; const fi=setInterval(()=>{v=Math.min(.85,v+.04); song.volume=v; if(v>=.85)clearInterval(fi);},60);
  }).catch(()=>{});
  scheduleSFX();
  t0=performance.now();
  requestAnimationFrame(loop);
}

function forgeTitle(){
  if(titleDone)return; titleDone=true;
  const el=$('title');
  el.innerHTML='<span class="w">RIDDLE</span> <span class="ch amp">&amp;</span> <span class="w">RUNE</span>';
  // wrap letters
  el.querySelectorAll('.w').forEach(w=>{w.innerHTML=[...w.textContent].map(c=>`<span class="ch">${c}</span>`).join('');});
  $('titleWrap').classList.add('show');
  const chars=[...el.querySelectorAll('.ch')];
  chars.forEach((c,i)=>setTimeout(()=>{c.classList.add('in'); const r=c.getBoundingClientRect();
    spark(r.left+r.width/2, r.top+r.height/2, ['#fff','#ffc64b','#c8a6ff'][i%3], 10, 220);},120+i*70));
  setTimeout(()=>$('tagline').classList.add('show'),120+chars.length*70+250);
  setTimeout(()=>{$('tap').classList.add('show');},120+chars.length*70+900);
}

function loop(now){
  const t=(now-t0)/1000, dt=Math.min(.05,(now-(loop._p||now))/1000); loop._p=now;
  // narrative lines
  LINES.forEach((L,i)=>{ if(!done.has('on'+i)&&t>=L.t){done.add('on'+i);$('line').innerHTML=L.html;$('line').classList.add('show');}
    if(!done.has('off'+i)&&t>=L.end){done.add('off'+i);$('line').classList.remove('show');}});
  // the strike
  if(!strikeDone&&t>=12.7){strikeDone=true; swing={x:-0.15,done:false};}
  if(!done.has('impact')&&t>=13.1){done.add('impact');
    const f=$('flash'); f.animate([{opacity:0},{opacity:1,offset:.12},{opacity:0}],{duration:600,easing:'ease-out'});
    if(!reduce)$('cine').animate([{transform:'translate(0,0)'},{transform:'translate(-10px,6px)'},{transform:'translate(9px,-5px)'},{transform:'translate(0,0)'}],{duration:520});
    eyes.forEach(e=>{if(!e.dead){e.dead=true;spark(e.x,e.y,e.hue===0?'#ff5a5a':'#c8a6ff',14,260);}});
    for(let i=0;i<80;i++)spark(W/2,H*.5,['#fff','#ffc64b','#7ce7ff'][i%3],1,rnd(80,460));
    $('line').classList.remove('show');
  }
  if(!done.has('title')&&t>=13.9){done.add('title'); forgeTitle();}

  render(t,dt);
  requestAnimationFrame(loop);
}

function render(t,dt){
  // background — warms toward centre as tension builds
  const warm=Math.max(0,Math.min(1,(t-6)/8));
  const g=ctx.createRadialGradient(W/2,H*.48,0,W/2,H*.48,Math.max(W,H)*.75);
  g.addColorStop(0,`rgba(${28+warm*40},${14+warm*8},${44+warm*20},1)`);
  g.addColorStop(.55,'#0a0714'); g.addColorStop(1,'#000');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // slow push-in
  const zoom=1+Math.min(.12,t*.007); ctx.save(); ctx.translate(W/2,H/2); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);

  // drifting runes (background)
  ctx.textAlign='center'; ctx.textBaseline='middle';
  glyphs.forEach(gl=>{gl.y+=gl.vy*dt; gl.tw+=dt; if(gl.y<-20){gl.y=H+20;gl.x=rnd(0,W);} const fl=(Math.sin(gl.tw)*.5+.5);
    ctx.globalAlpha=gl.a*(.4+fl*.6); ctx.fillStyle='#b79bff'; ctx.shadowColor='#7c5cff'; ctx.shadowBlur=12; ctx.font=gl.s+'px serif'; ctx.fillText(gl.ch,gl.x,gl.y);});
  ctx.shadowBlur=0; ctx.globalAlpha=1;

  // ash drifting down
  ash.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>H+10){p.y=-10;p.x=rnd(0,W);} ctx.globalAlpha=p.a;ctx.fillStyle='#6b6480';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();});

  // monster eyes
  eyes.forEach(e=>{
    if(e.dead)return;
    if(t>=e.born && e.open<1) e.open=Math.min(1,e.open+dt*1.4);
    if(e.open<=0)return;
    e.nextBlink-=dt; let lid=1; if(e.nextBlink<0){e.blink+=dt*10; lid=Math.abs(Math.cos(e.blink)); if(e.blink>3.14){e.blink=0;e.nextBlink=rnd(1.6,4);}}
    const op=e.open*lid; const col=e.hue===0?'255,70,70':`${Math.round(180)},${Math.round(140)},255`;
    const ex=e.x, ey=e.y, r=10*e.sc;
    // glow
    ctx.globalAlpha=op*.5; const gg=ctx.createRadialGradient(ex,ey,0,ex,ey,r*4); gg.addColorStop(0,`rgba(${col},.8)`); gg.addColorStop(1,`rgba(${col},0)`); ctx.fillStyle=gg; ctx.beginPath();ctx.arc(ex,ey,r*4,0,6.28);ctx.fill();
    // eye pair
    ctx.globalAlpha=op; ctx.fillStyle=`rgb(${col})`; ctx.shadowColor=`rgb(${col})`; ctx.shadowBlur=16;
    [-r*1.1,r*1.1].forEach(dx=>{ctx.beginPath();ctx.ellipse(ex+dx,ey,r*.7,r*(.35+.5*op),0,0,6.28);ctx.fill();});
    ctx.shadowBlur=0;
  });

  // the blade of light (t 8.6 → strike)
  if(t>8.6 && t<13.2){
    const grow=Math.min(1,(t-8.6)/2.2); const bx=W/2, topY=H*.5-H*.34*grow, botY=H*.5+H*.30*grow;
    const bw=(3+6*grow)*(t>12.6?rnd(.6,1.6):1);
    ctx.globalAlpha=.9; const lg=ctx.createLinearGradient(bx-bw,0,bx+bw,0); lg.addColorStop(0,'rgba(124,224,255,0)');lg.addColorStop(.5,'rgba(255,255,255,.95)');lg.addColorStop(1,'rgba(124,92,255,0)');
    ctx.fillStyle=lg; ctx.shadowColor='#7ce7ff'; ctx.shadowBlur=26; ctx.fillRect(bx-bw,topY,bw*2,botY-topY); ctx.shadowBlur=0;
    // runes racing up the blade
    ctx.globalAlpha=Math.min(1,grow); ctx.fillStyle='#e9ddff'; ctx.font='16px serif'; ctx.shadowColor='#c8a6ff'; ctx.shadowBlur=10;
    for(let i=0;i<7;i++){const yy=botY-((t*90+i*40)% (botY-topY)); ctx.fillText(RUNES[(i*3+((t*4)|0))%RUNES.length],bx,yy);}
    ctx.shadowBlur=0;
  }
  // swing arc
  if(swing && !swing.done){ swing.x+=dt*2.4; const sx=swing.x*W;
    ctx.globalAlpha=.85; const sg=ctx.createLinearGradient(sx-120,0,sx+30,0); sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(1,'rgba(255,255,255,.9)');
    ctx.fillStyle=sg; ctx.shadowColor='#fff'; ctx.shadowBlur=40; ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx-140,0); ctx.lineTo(sx-90,H);ctx.lineTo(sx+40,H); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
    if(swing.x>1.2)swing.done=true;
  }

  // embers (foreground, over everything)
  embers.forEach(p=>{p.y+=p.vy*dt; p.x+=Math.sin((t+p.d*6)*1.2)*6*dt*10*.1; if(p.y<-10){p.y=H+rnd(0,60);p.x=rnd(0,W);}
    const fl=.6+.4*Math.sin((t*4)+p.d*7); ctx.globalAlpha=p.a*fl; ctx.fillStyle=`hsl(${p.h},100%,62%)`; ctx.shadowColor=`hsl(${p.h},100%,55%)`; ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();});
  ctx.shadowBlur=0;

  // sparks (strike + title)
  sparks.forEach(s=>{s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=120*dt; const k=1-s.t/s.life; if(k<=0)return;
    ctx.globalAlpha=Math.max(0,k); ctx.fillStyle=s.col; ctx.shadowColor=s.col; ctx.shadowBlur=10; ctx.beginPath();ctx.arc(s.x,s.y,s.r*k,0,6.28);ctx.fill();});
  sparks=sparks.filter(s=>s.t<s.life);
  ctx.shadowBlur=0; ctx.globalAlpha=1;
  ctx.restore();
}

// ---------- controls ----------
function enter(){ /* into the app — here we just restart-preview */ location.reload(); }
$('begin').addEventListener('click',start);
$('gate').addEventListener('click',e=>{if(e.target===$('gate'))start();});
$('skip').addEventListener('click',(e)=>{e.stopPropagation(); enter();});
$('tap').addEventListener('click',enter);
$('cine').addEventListener('click',()=>{ if(started && $('tap').classList.contains('show')) enter(); });
resize();
</script>
</body>
</html>
